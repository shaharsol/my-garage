<!DOCTYPE html>

    <title>Flying Hats Collection</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

            </div>
            <div class="gallery-item">
                <img src="hat2.jpg" alt="Red flying hat">

            </div>
            <div class="gallery-item">
                <img src="hat3.jpg" alt="Green flying hat">
                <p>Green Explorer Hat</p>

    <footer>
        <p>&copy; 2023 Flying Hats Inc.</p>
    </footer>
